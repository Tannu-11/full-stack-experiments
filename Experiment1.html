<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        form {
            width: 400px;
            margin: 100px auto;
            padding: 50px;
            background-color: rgb(246, 246, 246);
            border-radius: 50px;
            box-shadow: 0 8px 16px rgba(10, 10, 10, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #000000;
        }

        label {
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input:focus {
            border-color: #5e5b98;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #18164b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ef3939c5;
        }
    </style>
</head>

<body>

<form>
    <h1>Student Registration</h1>

    <label>Name</label>
    <input
        type="text"
        placeholder="Enter full name"
        required
        minlength="4"
        maxlength="40"
        pattern="[A-Za-z ]+"
    >

    <label>Email</label>
    <input
        type="email"
        placeholder="Enter valid email"
        required
    >

    <label>Age</label>
    <input
        type="number"
        placeholder="Enter age"
        required
        min="18"
        max="60"
    >
    <label>UID</label>
    <input
    type="text"
    placeholder="Enter name"
    required
    minlength="10"
    maxlength="12"
    pattern="[A-Za-z0-9]+"
    title="Enter 10–12 letters only"
>

    <button type="submit">Register</button>
</form>

</body>
</html>
