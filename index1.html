<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Banking App</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
        }

        .bank {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: center;
        }

        input, button {
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            width: 90%;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="bank">
        <h2>Bank Account</h2>
        <h3>Balance: ₹<span id="balance">1000</span></h3>

        <input type="number" id="amount" placeholder="Enter Amount">

        <button onclick="deposit()">Deposit</button>
        <button onclick="withdraw()">Withdraw</button>
    </div>

    <script>
        let balance = 1000;

        function deposit() {
            let amt = Number(document.getElementById("amount").value);
            balance += amt; // balance = balance + amt
            document.getElementById("balance").innerText = balance;
        }

        function withdraw() {
            let amt = Number(document.getElementById("amount").value);
            if (amt <= balance) {
                balance -= amt;
                document.getElementById("balance").innerText = balance;
            } else {
                alert("Insufficient Balance");
            }
        }
    </script>

</body>

</html>
